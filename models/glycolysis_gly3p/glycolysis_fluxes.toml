[metadata]
description = "Glycolysis flux distribution"
units = "mmol/g_DCW/h"
steady_state = true

# ============================================================================
# External Fluxes (uptake and secretion rates)
# ============================================================================

[external_fluxes]
glc_uptake = 100.0043      # Glucose uptake
pyr_secretion = 87.5243    # Pyruvate secretion

# ============================================================================
# Internal Fluxes (reaction rates)
# ============================================================================
#
# Every metabolite balance closes exactly. The independent fluxes are
# glc_uptake, G6PDH2r_PGL, r5p_drain, GLY3PDH and LDH; the rest follow from
# stoichiometry.

[internal_fluxes]
# Main glycolysis pathway
GLUT2 = 100.0043           # Glucose transport
HEX = 100.0043             # Hexokinase
GPI = 82.5514              # Glucose-6-phosphate isomerase
PFK = 93.52                # Phosphofructokinase
FBA = 93.52                # Fructose-bisphosphate aldolase
GLY3PDH = 5.0              # Glycerol 3-phosphate dehydrogenase
TPI = 88.52                # Triose-phosphate isomerase (= FBA - GLY3PDH)
GAPD_PGK = 187.5243        # GAPD + PGK (~2x flux due to 2 G3P per glucose)
PGM = 187.5243             # Phosphoglycerate mutase
PYK = 187.5243             # Pyruvate kinase
pyr_drain = 87.5243        # Pyruvate export
LDH = 100.0                # Lactate formation

# Oxidative pentose phosphate pathway
G6PDH2r_PGL = 17.4529      # Glucose-6-phosphate dehydrogenase
GND = 17.4529              # 6-Phosphogluconate dehydrogenase
RPI = 6.4843               # Ribose-5-phosphate isomerase (= TKT half flux + r5p_drain)
RPE = 10.9686              # Ribulose-5-phosphate epimerase (= X5P_EC2)
r5p_drain = 1.0            # R5P for biomass

# Non-oxidative pentose phosphate pathway: transketolase/transaldolase half
# reactions via the enzyme-bound EC2 (2-carbon) and EC3 (3-carbon) carriers.
# Net fluxes follow from the EC2/EC3 pool balances, where the overall reactions
# carry 5.4843 each:
#   X5P_EC2 =  TKT1 + TKT2   S7P_EC2 = -TKT1   F6P_EC2 = -TKT2
#   S7P_EC3 =  TALA          F6P_EC3 = -TALA
# A negative value means the half reaction runs backwards relative to how it is
# written in reactions.tsv, which is why its deltaG is positive.
X5P_EC2 = 10.9686          # xu5p -> EC2 + g3p
F6P_EC2 = -5.4843          # f6p -> EC2 + e4p (runs in reverse)
S7P_EC2 = -5.4843          # s7p -> EC2 + r5p (runs in reverse)
F6P_EC3 = -5.4843          # f6p -> EC3 + g3p (runs in reverse)
S7P_EC3 = 5.4843           # s7p -> EC3 + e4p
