[metadata]
description = "Glycolysis labeling measurements"
measurement_type = "MS"
includes_error = true

# ============================================================================
# Measurement Protocol
# ============================================================================

[protocol]
replicates = 3
randomize_order = false
blank_correction = true
internal_standard = "none"

# ============================================================================
# Measurements
# ============================================================================

# Measure key glycolytic intermediates
[[measurements]]
name = "G6P_full"
metabolite = "g6p"
atoms = [0, 1, 2, 3, 4, 5]
timepoints = [0.1, 0.5, 1.0, 5.0, 10.0, 30.0, 60.0, 100.0]
error_absolute = 0.01
error_relative = 0.02
notes = "Glucose 6-phosphate - all 6 carbons"

[[measurements]]
name = "F6P_full"
metabolite = "f6p"
atoms = [0, 1, 2, 3, 4, 5]
timepoints = [0.1, 0.5, 1.0, 5.0, 10.0, 30.0, 60.0, 100.0]
error_absolute = 0.01
error_relative = 0.02
notes = "Fructose 6-phosphate - all 6 carbons"

[[measurements]]
name = "DHAP_full"
metabolite = "dhap"
atoms = [0, 1, 2]
timepoints = [0.1, 0.5, 1.0, 5.0, 10.0, 30.0, 60.0, 100.0]
error_absolute = 0.01
error_relative = 0.02
notes = "Dihydroxyacetone phosphate - all 3 carbons"

[[measurements]]
